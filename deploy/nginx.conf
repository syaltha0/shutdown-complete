# /etc/nginx/sites-available/planner  ->  ln -s ../sites-available/planner /etc/nginx/sites-enabled/
# Replace planner.example.com with your domain, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d planner.example.com  (certbot adds the 443 server block and the redirect)

server {
    listen 80;
    listen [::]:80;
    server_name planner.example.com;

    client_max_body_size 10m;   # backup imports

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the app rate-limits sign-ins by this
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
