<!doctype html>
<meta charset="utf-8">
<title>tutorial compositor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=block">
<!--
  Draws the finished tutorial film one frame at a time, for tools/tutorial/render.mjs. Every frame is a pure function
  of the film time (springs are stepped at a fixed rate from the start of each clip), so a render is the same every time.

  The film: the app sits as a window on a quiet backdrop. Each chapter opens on a title card; the card gives way to
  the window, which comes into focus; the camera moves in on the action and back out before the chapter ends; the
  window goes soft and the next card rises. The last chapter hands over to the first card, so the loop has no seam.
  Inside the window: a spring camera (one or two shots a chapter; each target is clamped before the spring, so the
  camera never chases an edge), a soft spotlight around what a step is about, the recorded hand drawn as a crisp
  cursor, and low in the frame a caption with the step in words.
-->
<script>
const OUT_W = 1600, OUT_H = 1000, DT = 1 / 240;
// the window at rest, and how far the camera may go in (1.5x the recording)
const M = 0.055, WIN = { x: OUT_W * M, y: OUT_H * M, w: OUT_W * (1 - 2 * M), h: OUT_H * (1 - 2 * M) }, RADIUS = 18;
const Z_MAX = 1.5 / (1 - 2 * M), CAPTION_ROOM = 0.13;
// timing (seconds)
const WIN_IN = 0.8, WIN_OUT = 0.6, HOLD_FULL = 0.6, OUT_S = 1.5, CAP_HIDE = 1.3;
const CARD_SPAN = 1.1, CARD_HOLD = 0.7, CARD_OUT = 0.5, CARD_LEAD = 0.4;
// springs (rad/s): the camera is slow and never overshoots; the hand follows closely
const W_CAM = 2.7, W_SPOT = 5.5, W_HOLE = 6.5, W_HAND = 28, W_PRESS = 36;
const BACKDROP = '#e8e8e6', INK = '#111111', MUTED = '#8c8c8a', DIM = 'rgba(14, 16, 20, 0.2)';

const canvas = () => Object.assign(document.createElement('canvas'), { width: OUT_W, height: OUT_H });
const out = canvas(), layer = canvas(), dim = canvas();
let D = null, plan = null;

const clamp01 = (k) => Math.min(1, Math.max(0, k));
const ease = (k) => -(Math.cos(Math.PI * clamp01(k)) - 1) / 2;
const easeOut = (k) => 1 - Math.pow(1 - clamp01(k), 3);
const spring = (x, v, to, w) => { const a = w * w * (to - x) - 2 * w * v; v += a * DT; return [x + v * DT, v]; };

window.setup = async (data) => {
  D = data;
  await Promise.all(['400 30px Jost', '500 34px Jost', '500 84px Jost'].map((f) => document.fonts.load(f, 'AaĞğŞşİıÇçÖöÜü 0123')));
  // card k rises (CARD_SPAN), holds, and fades as clip k's window comes in; the next card rises as that window leaves.
  // The film opens on the first card already up, and ends on the same card rising again, so the loop has no seam.
  const n = D.clips.length, cards = [{ in: -CARD_SPAN, out: CARD_HOLD, scene: 0 }], starts = [];
  for (let k = 0; k < n; k++) {
    const start = cards[k].out;
    starts.push(start);
    const cin = start + D.clips[k].duration - CARD_LEAD;
    cards.push({ in: cin, out: k + 1 < n ? cin + CARD_SPAN + CARD_HOLD : Infinity, scene: k + 1 < n ? k + 1 : 0 });
  }
  const loopAt = cards[n].in, total = loopAt + CARD_SPAN;
  plan = { cards, starts, total, loopAt };
  const r3 = (x) => +x.toFixed(3);
  const chapters = starts.map((s, k) => ({ start: k === 0 ? 0 : r3(cards[k].in), end: r3(cards[k + 1].in),
    steps: [0, 1].map((st) => +(s + (D.clips[k].marks.find((m) => m.step === st)?.start ?? 0)).toFixed(3)) }));
  return { total, loopAt, chapters };
};

// ---------- the recording ----------
const bitmaps = new Map();
async function bitmap(file) {
  if (bitmaps.has(file)) return bitmaps.get(file);
  const b = await createImageBitmap(await (await fetch(`/f/${file}`)).blob());
  bitmaps.set(file, b);
  if (bitmaps.size > 16) { const [k, old] = bitmaps.entries().next().value; old.close(); bitmaps.delete(k); }
  return b;
}
const lastAt = (list, abs) => {
  let lo = 0, hi = list.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (list[mid].t <= abs) lo = mid; else hi = mid - 1; }
  return lo;
};
function handAt(abs) {
  const c = D.cursor, i = lastAt(c, abs), a = c[i], b = c[i + 1];
  if (abs <= a.t || !b) return a;
  const k = Math.min(1, (abs - a.t) / Math.max(1e-3, b.t - a.t));
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
}
const pressedAt = (abs) => { let p = false; for (const e of D.presses) { if (e.t > abs) break; p = e.down; } return p; };

// ---------- the camera, in output pixels of the window at rest ----------
const toWin = (fx, fy) => [WIN.x + fx * WIN.w, WIN.y + fy * WIN.h];
const FULL = { z: 0, cx: OUT_W / 2, cy: OUT_H / 2 };
function camTarget(clip, t) {
  if (t < HOLD_FULL || t >= clip.duration - OUT_S) return FULL;
  let c = null;
  for (const x of clip.camera) { if (x.t > t) break; c = x; }
  if (!c) return FULL;
  const w = c.w * WIN.w, h = c.h * WIN.h, [px, py] = toWin(c.x, c.y);
  // room under the subject for the caption; clamped here, so the spring never runs at an edge and back
  const z = Math.max(1, Math.min(Z_MAX, OUT_W / w, (OUT_H * (1 - CAPTION_ROOM)) / h));
  const vw = OUT_W / z, vh = OUT_H / z;
  const cx = Math.min(OUT_W - vw / 2, Math.max(vw / 2, px + w / 2));
  const cy = Math.min(OUT_H - vh / 2, Math.max(vh / 2, py + h / 2 + (vh * CAPTION_ROOM) / 2));
  return { z: Math.log(z), cx, cy };
}
const markAt = (clip, t) => (t < clip.duration - CAP_HIDE && clip.marks.find((m) => m.start <= t && t < m.end)) || null;

const sims = new Map();
function simulate(k, t) {
  const clip = D.clips[k];
  let s = sims.get(k);
  if (!s || s.t > t + 1e-9) {
    const h = handAt(clip.t0);
    s = { t: 0, z: 0, vz: 0, cx: OUT_W / 2, vcx: 0, cy: OUT_H / 2, vcy: 0, a: 0, va: 0, hole: null, vh: [0, 0, 0, 0], hx: h.x, hy: h.y, vhx: 0, vhy: 0, p: 0, vp: 0 };
    sims.set(k, s);
  }
  while (s.t + DT <= t + 1e-9) {
    s.t += DT;
    const c = camTarget(clip, s.t);
    [s.z, s.vz] = spring(s.z, s.vz, c.z, W_CAM);
    [s.cx, s.vcx] = spring(s.cx, s.vcx, c.cx, W_CAM);
    [s.cy, s.vcy] = spring(s.cy, s.vcy, c.cy, W_CAM);
    const m = markAt(clip, s.t);
    [s.a, s.va] = spring(s.a, s.va, m ? 1 : 0, W_SPOT);
    if (m) {
      const to = [m.x, m.y, m.w, m.h];
      if (!s.hole || s.a < 0.03) { s.hole = to.slice(); s.vh = [0, 0, 0, 0]; }
      for (let i = 0; i < 4; i++) [s.hole[i], s.vh[i]] = spring(s.hole[i], s.vh[i], to[i], W_HOLE);
    }
    const abs = clip.t0 + s.t * D.speed, h = handAt(abs);
    [s.hx, s.vhx] = spring(s.hx, s.vhx, h.x, W_HAND);
    [s.hy, s.vhy] = spring(s.hy, s.vhy, h.y, W_HAND);
    [s.p, s.vp] = spring(s.p, s.vp, pressedAt(abs) ? 1 : 0, W_PRESS);
  }
  return s;
}

// ---------- one clip's window, with its camera, spotlight and hand ----------
const ARROW = new Path2D('M4 2.5l14 11.2-6.3 1.1 3.9 7.3-3 1.5-3.9-7.4-4.7 4.6z');
async function drawWindow(g, k, t) {
  const clip = D.clips[k], s = simulate(k, t);
  const z = Math.exp(s.z);
  const cx = Math.min(OUT_W - OUT_W / z / 2, Math.max(OUT_W / z / 2, s.cx)), cy = Math.min(OUT_H - OUT_H / z / 2, Math.max(OUT_H / z / 2, s.cy));
  const ox = OUT_W / 2 - cx * z, oy = OUT_H / 2 - cy * z;
  const S = ([x, y]) => [ox + x * z, oy + y * z]; // the window at rest to the screen
  const bmp = await bitmap(D.frames[lastAt(D.frames, clip.t0 + t * D.speed)].file);

  g.clearRect(0, 0, OUT_W, OUT_H);
  g.save();
  g.setTransform(z, 0, 0, z, ox, oy);
  // the window: a soft shadow on the backdrop, then the recording inside rounded corners
  g.shadowColor = 'rgba(20, 20, 18, 0.16)'; g.shadowBlur = 48 * z; g.shadowOffsetY = 16 * z;
  g.fillStyle = '#ffffff';
  g.beginPath(); g.roundRect(WIN.x, WIN.y, WIN.w, WIN.h, RADIUS); g.fill();
  g.shadowColor = 'transparent';
  g.save();
  g.beginPath(); g.roundRect(WIN.x, WIN.y, WIN.w, WIN.h, RADIUS); g.clip();
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, WIN.x, WIN.y, WIN.w, WIN.h);
  g.restore();
  g.strokeStyle = 'rgba(0, 0, 0, 0.07)'; g.lineWidth = 1 / z;
  g.beginPath(); g.roundRect(WIN.x, WIN.y, WIN.w, WIN.h, RADIUS); g.stroke();
  g.restore();

  // the spotlight: the window dims a little, except a feathered patch where the step is
  if (s.a > 0.004 && s.hole) {
    const d = dim.getContext('2d');
    d.globalCompositeOperation = 'source-over';
    d.clearRect(0, 0, OUT_W, OUT_H);
    const [wx, wy] = S([WIN.x, WIN.y]);
    d.globalAlpha = Math.min(1, s.a);
    d.fillStyle = DIM;
    d.beginPath(); d.roundRect(wx, wy, WIN.w * z, WIN.h * z, RADIUS * z); d.fill();
    d.globalAlpha = 1;
    d.globalCompositeOperation = 'destination-out';
    d.fillStyle = '#000';
    const [hx, hy, hw, hh] = s.hole, [px, py] = S(toWin(hx, hy)), pad = 12 * z;
    d.filter = `blur(${Math.round(18 * z)}px)`;
    d.beginPath(); d.roundRect(px - pad, py - pad, hw * WIN.w * z + 2 * pad, hh * WIN.h * z + 2 * pad, 16 * z); d.fill();
    d.filter = 'none';
    g.drawImage(dim, 0, 0);
  }

  // the hand
  const scale = (WIN.w / D.width) * z; // screen pixels per CSS pixel of the recording
  const [hx, hy] = S(toWin(s.hx / D.width, s.hy / D.height)), abs = clip.t0 + t * D.speed;
  for (const e of D.presses) {
    if (!e.down) continue;
    const age = (abs - e.t) / D.speed;
    if (age < 0) break;
    if (age > 0.6) continue;
    const q = easeOut(age / 0.6);
    g.beginPath(); g.arc(hx, hy, (5 + 16 * q) * scale, 0, Math.PI * 2);
    g.strokeStyle = `rgba(17, 17, 17, ${0.3 * (1 - q)})`; g.lineWidth = 1.5 * scale; g.stroke();
  }
  g.save();
  g.translate(hx, hy);
  const sc = scale * 0.9 * (1 - 0.12 * s.p);
  g.scale(sc, sc); g.translate(-4, -2.5);
  g.shadowColor = 'rgba(0, 0, 0, 0.22)'; g.shadowBlur = 5 * sc; g.shadowOffsetY = 1.2 * sc;
  g.fillStyle = '#101010'; g.fill(ARROW);
  g.shadowColor = 'transparent';
  g.strokeStyle = '#ffffff'; g.lineWidth = 1.5; g.lineJoin = 'round'; g.stroke(ARROW);
  g.restore();
}

// ---------- type ----------
// words that rise into place one after another, from time `from`
function words(g, text, x, y, font, color, from, t, { stagger = 0.05, dur = 0.55, rise = 18 } = {}) {
  g.font = font; g.fillStyle = color; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const space = g.measureText(' ').width;
  let cx = x;
  text.split(' ').forEach((w, j) => {
    const a = easeOut((t - from - j * stagger) / dur);
    if (a > 0) { g.save(); g.globalAlpha *= a; g.fillText(w, cx, y + (1 - a) * rise); g.restore(); }
    cx += g.measureText(w).width + space;
  });
}

// a chapter card: the number, then the title, on the backdrop
function drawCard(g, card, t) {
  if (t < card.in || t > card.out + CARD_OUT) return;
  const leave = ease((t - card.out) / CARD_OUT);
  g.save();
  g.globalAlpha = 1 - leave;
  if (leave > 0) { g.translate(0, -16 * leave); g.filter = `blur(${(leave * 6).toFixed(1)}px)`; }
  words(g, String(card.scene + 1).padStart(2, '0'), 150, 446, '400 30px Jost', MUTED, card.in, t, { rise: 10 });
  words(g, D.texts.scenes[card.scene].title, 150, 552, '500 84px Jost', INK, card.in + 0.1, t, { rise: 22 });
  g.restore();
}

// the caption: the step in words, low in the frame, on a dark plate that resizes from one step to the next
function drawCaption(g, k, t, alpha) {
  const clip = D.clips[k], steps = D.texts.scenes[k].steps;
  const s0 = clip.marks.find((m) => m.step === 0)?.start, s1 = clip.marks.find((m) => m.step === 1)?.start;
  if (s0 == null) return;
  const hide = clip.duration - CAP_HIDE, gone = ease((t - hide) / 0.45);
  const show = easeOut((t - s0) / 0.5) * (1 - gone);
  if (show <= 0.001) return;
  const FONT = '500 34px Jost', NUM = '500 20px Jost', H = 76, PADL = 19, PADR = 30, GAP = 16, BALL = 38;
  g.save();
  g.font = FONT;
  const width = (i) => PADL + BALL + GAP + g.measureText(steps[i]).width + PADR;
  const swap = s1 == null ? 0 : ease((t - s1) / 0.55);
  const w = width(0) + (width(1) - width(0)) * swap;
  const x = 64, y = OUT_H - 64 - H + (1 - easeOut((t - s0) / 0.5)) * 18 + gone * 8;
  g.globalAlpha = alpha * show;
  g.shadowColor = 'rgba(0, 0, 0, 0.18)'; g.shadowBlur = 30; g.shadowOffsetY = 8;
  g.fillStyle = 'rgba(17, 17, 17, 0.9)';
  g.beginPath(); g.roundRect(x, y, w, H, 18); g.fill();
  g.shadowColor = 'transparent';
  g.beginPath(); g.roundRect(x, y, w, H, 18); g.clip();
  const line = (i, from, until) => {
    const leave = until == null ? 0 : clamp01((t - until) / 0.3);
    if (t < from || leave >= 1) return;
    g.save();
    g.globalAlpha *= 1 - leave;
    g.translate(0, -12 * easeOut(leave));
    const bx = x + PADL, by = y + (H - BALL) / 2, up = easeOut((t - from) / 0.45), dy = (1 - up) * 10;
    g.save();
    g.globalAlpha *= up;
    g.strokeStyle = 'rgba(255, 255, 255, 0.5)'; g.lineWidth = 2;
    g.beginPath(); g.arc(bx + BALL / 2, by + BALL / 2 + dy, BALL / 2 - 1, 0, Math.PI * 2); g.stroke();
    g.font = NUM; g.fillStyle = '#ffffff'; g.textAlign = 'center';
    g.fillText(String(i + 1), bx + BALL / 2, by + BALL / 2 + 7 + dy);
    g.restore();
    words(g, steps[i], bx + BALL + GAP, y + H / 2 + 12, FONT, '#ffffff', from + 0.06, t, { stagger: 0.045, dur: 0.45, rise: 12 });
    g.restore();
  };
  line(0, s0, s1);
  if (s1 != null) line(1, s1 + 0.15, null);
  g.restore();
}

/** Where the camera looks at film time T (for checking the camerawork without pictures): clip, zoom, view centre. */
window.probe = (T) => {
  for (let k = 0; k < D.clips.length; k++) {
    const local = T - plan.starts[k];
    if (local < 0 || local > D.clips[k].duration) continue;
    const s = simulate(k, local);
    return { k, t: +local.toFixed(2), z: +Math.exp(s.z).toFixed(3), cx: Math.round(s.cx), cy: Math.round(s.cy) };
  }
  return null;
};

/** The film at time T, as a JPEG data URL. */
window.frame = async (T) => {
  const g = out.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.filter = 'none';
  g.fillStyle = BACKDROP; g.fillRect(0, 0, OUT_W, OUT_H);
  for (const c of plan.cards) drawCard(g, c, T);
  for (let k = 0; k < D.clips.length; k++) {
    const local = T - plan.starts[k], dur = D.clips[k].duration;
    if (local < 0 || local > dur) continue;
    const enter = easeOut(local / WIN_IN), leave = ease((local - (dur - WIN_OUT)) / WIN_OUT);
    const a = enter * (1 - leave);
    if (a <= 0.001) continue;
    await drawWindow(layer.getContext('2d'), k, local);
    const sc = (0.965 + 0.035 * enter) * (1 - 0.025 * leave), blur = (1 - enter) * 10 + leave * 8;
    g.save();
    g.globalAlpha = a;
    if (blur > 0.2) g.filter = `blur(${blur.toFixed(1)}px)`;
    g.drawImage(layer, (OUT_W - OUT_W * sc) / 2, (OUT_H - OUT_H * sc) / 2, OUT_W * sc, OUT_H * sc);
    g.restore();
    drawCaption(g, k, local, a);
  }
  return out.toDataURL('image/jpeg', 0.93);
};
</script>
